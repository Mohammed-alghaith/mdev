name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: mdev-windows-installer
            args: --win nsis
          - os: macos-latest
            artifact: mdev-macos-installer
            args: --mac
    runs-on: ${{ matrix.os }}
    env:
      # Monaco makes the vite bundle large enough to hit V8's default heap cap
      # (macOS OOM'd during `vite build`); give the renderer build headroom.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron / electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      # electron-builder rebuilds native deps (node-pty) against Electron's ABI
      # automatically (npmRebuild is on by default). CSC_IDENTITY_AUTO_DISCOVERY
      # off → unsigned builds (no signing certs in the repo), like the Windows one.
      - name: Package installer
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Desktop wrapper for the Claude CLI / Claude Agent SDK with a DeepSeek backend.

            **Install**
            - macOS: `Mdev-*-arm64.dmg`
            - Windows: `Mdev Setup *.exe`

            **Highlights**
            - Multi-tab terminals + agent tabs
            - Browser preview, Monaco editor, file manager, voice dictation
            - Session sidebar (resume / hide / delete) + live context meter
            - Five permission modes: Ask / Plan / Act / Safe / Auto
            - DeepSeek provider support via Settings
            - In-app MCP tools: open_browser, navigate_browser, open_in_editor, screenshot_browser (with OCR)
          files: |
            artifacts/mdev-macos-installer/*.dmg
            artifacts/mdev-windows-installer/*.exe
